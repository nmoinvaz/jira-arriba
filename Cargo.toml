[package]
name = "jira-arriba"
version = "0.1.0"
edition = "2024"
description = "Jira CLI for attachments, Markdown as ADF, JQL search, and transitions, sharing acli's login"
license = "MIT"
repository = "https://github.com/nmoinvaz/jira-arriba"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
flate2 = "1.1"
glob = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"

[dev-dependencies]
mockito = "1"
tempfile = "3"
